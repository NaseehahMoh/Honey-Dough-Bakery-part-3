<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | Honey Dough Bakery</title>
    <meta name="description" content="Send an order request to Honey Dough Bakery for cakes, pastries, breads and custom baked goods.">
    <meta name="keywords" content="bakery order form, order cakes, order pastries, Honey Dough Bakery">
    <meta name="author" content="Honey Dough Bakery">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
        <h1>Honey Dough Bakery</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section><h2>Place Your Order</h2><p>Complete the form below to send us your order request. We will contact you to confirm the details.</p></section>
        <section>
            <form id="order-form" class="bakery-form" novalidate>
                <label for="customer-name">Full Name:</label><input type="text" id="customer-name" name="customer-name" minlength="2" required>
                <label for="customer-email">Email Address:</label><input type="email" id="customer-email" name="customer-email" required>
                <label for="phone">Phone Number:</label><input type="tel" id="phone" name="phone" pattern="[0-9+()\s-]{7,20}" required>
                <label for="product">Select a Product:</label>
                <select id="product" name="product" required><option value="">-- Please Select --</option><option value="Cake">Cake</option><option value="Pastries">Pastries</option><option value="Bread">Bread</option><option value="Custom Order">Custom Order</option><option value="Catering">Catering</option></select>
                <label for="quantity">Quantity:</label><input type="number" id="quantity" name="quantity" min="1" max="100" required>
                <label for="date">Preferred Collection Date:</label><input type="date" id="date" name="date" required>
                <label for="delivery">Order Method:</label>
                <select id="delivery" name="delivery" required><option value="">-- Please Select --</option><option value="Collection">Collection</option><option value="Delivery">Delivery</option></select>
                <label for="order-details">Order Details:</label><textarea id="order-details" name="order-details" rows="6" minlength="5" placeholder="Tell us about your order, flavour, size, design or any special requirements..." required></textarea>
                <p id="order-feedback" class="form-message" role="status" aria-live="polite"></p>
                <button type="submit">Prepare Order Email</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Honey Dough Bakery. All rights reserved.</p>
        <p>Pietermaritzburg, KwaZulu-Natal | 012 345 6789</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
